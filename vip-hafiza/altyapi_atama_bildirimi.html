<!--
  VVIP ALTYAPI · ATAMA BİLDİRİMİ  v1.0 (04.10.2026)
  ------------------------------------------------------------------
  Betik Düzenleyicisi (Script Editor) web bölümüne olduğu gibi yapıştırın:
    • VVIP Altyapı Takip sayfasına (gün boyu açık duran ekran — asıl çalıştığı yer)
    • Talep Metni Oluşturucu'ya gerek yok: bu blok onun içinde zaten var (aynı kod, bir kez çalışır).

  Ne yapar?
   1) ATAMA: "VVIP Altyapi Takip" listesine Beklemede durumunda yeni bir kayıt girilip Takipçi atanınca
      takipçiye mail atar: "Size şu talepler atandı · şu bilgiler eksik, tamamlanması gerekiyor".
      Aynı kişiye aynı anda giren kayıtlar (ör. Toptan'dan gelen 8 talep) TEK mailde, tablo olarak gider.
      Takipçi sonradan değiştirilirse yeni takipçiye de gider.
   2) HATIRLATMA (isteğe bağlı): Atamadan HATIRLATMA_GUN gün sonra kayıt hâlâ Beklemede ve bilgisi
      hâlâ eksikse takipçiye BİR KEZ hatırlatma gider (0 = kapalı).
   Eksik bilgi kuralları Altyapı ekranının "künye eksik" kuralıyla aynıdır (Proje Türü, Proje ID, HP,
   Toplam Maliyet, Fiber Mesafesi, Adres; BF ise Çalışan DSL ve Mevcut Hız) + talep yazısı (Aşama)
   + harita görseli (VVIPAltyapiEkler kütüphanesindeki P<ProjeID> klasörü).

  Nasıl çalışır?
   Sunucu tarafı yoktur; ekrandaki VIP Hafıza / Taahhüt alarmlarıyla aynı yöntem: sayfayı açık tutan
   HERHANGİ bir ekip üyesinin tarayıcısı 5 dakikada bir listeye bakar. Her bildirim VVIPAtamaBildirimLog
   listesine yazılır; aynı mail iki kez gitmez, aynı anda birden çok kişi sayfadaysa kilit tek gönderim sağlar.
   Gönderen SharePoint'in kendi mail servisidir (SP.Utilities.Utility.SendEmail).
   Kurulumdan ÖNCE açılmış kayıtlar için mail gitmez.

  Altyapı ekranıyla bağlantı:
   Maildeki "Altyapı Takip'te aç" düğmesi sayfayı ?kayit=<Id> ile açar; bu blok Altyapı sayfasında
   o kaydın formunu kendiliğinden açar. Altyapı sayfasının adresi ilk çalıştığında log'a kaydedilir
   (ALTYAPI_SAYFA boşsa bile maillerdeki bağlantı doğru sayfaya gider).

  İlk kurulum (bir kez, yönetici hesabıyla):
   Sol alttaki soluk lacivert noktaya tıklayın → "Kur / Onar" → "Önizle" ile kime ne gideceğine bakın.
  Konsol (F12): VHAtama.kontrol() · VHAtama.onizle() · VHAtama.durum()
  ES5 · harici bağımlılık yok
  ------------------------------------------------------------------
-->

<script>
(function () {
  if (window.VHAtama) return;                 // aynı sayfada iki kez eklenirse tek çalışsın

  /* ============================ ⚙️ AYARLAR ============================ */
  var CFG = {
    SITE: 'https://ttport.turktelekom.com.tr/gruplar/vip-hafiza',
    LISTE: 'VVIP Altyapi Takip',
    LOG_LISTE: 'VVIPAtamaBildirimLog',
    EK_LIB: 'VVIPAltyapiEkler',               // Altyapı ekranının harita kütüphanesi (P<ProjeID>/HARITA-n.jpg)

    // Takipçi seçenekleri ve e-postaları — Talep Metni Oluşturucu'daki sorumlu listesi de buradan okunur.
    // Takipçi sütunundaki değer ad soyad olsa da ("Fırat Özyurt") ilk ada göre eşleşir.
    EKIP: [
      { ad: 'Fırat',  mail: 'Firat.Ozyurt@turktelekom.com.tr' },
      { ad: 'Melek',  mail: 'melek.gulce@turktelekom.com.tr' },
      { ad: 'Arzu',   mail: 'arzuece.karaca@turktelekom.com.tr' },
      { ad: 'Tarık',  mail: 'tarik.ozden@turktelekom.com.tr' },
      { ad: 'Enes',   mail: 'enesfurkan.gul@turktelekom.com.tr' },
      { ad: 'Can',    mail: 'mehmetcan.aksoy@turktelekom.com.tr' },
      { ad: 'Gülsüm', mail: 'ummugulsum.topal@turktelekom.com.tr' }
    ],
    BILGI: [],                                // her maile Bilgi (CC) olarak eklenecek adresler, örn: ['tarik.bektas@turktelekom.com.tr']
    YONETICILER: ['mehmetcan.aksoy@turktelekom.com.tr'],   // paneli yalnızca bunlar görür

    ALTYAPI_SAYFA: '',                        // boş bırakılabilir: Altyapı sayfasında ilk çalıştığında adresi kendisi öğrenir
    HATIRLATMA_GUN: 3,                        // atamadan kaç gün sonra eksikler için BİR KEZ hatırlatılsın (0 = hatırlatma yok)
    KENDINE_DE: false,                        // kaydı açan kişi takipçiyle aynıysa da mail gitsin mi
    YERLESME_DK: 2,                           // toplu kayıt sürerken parça parça mail gitmesin: kayıt en az bu kadar eski olmalı
    KONTROL_ARALIGI_DK: 5,
    KILIT_ZAMAN_ASIMI_DK: 20,
    HATA_TEKRAR_DK: 15,
    MAX_DENEME: 3,
    KONU_ETIKETI: '[VIPH-ATAMA]',             // Outlook kuralı bu etikete bakabilir
    AYAR_ANAHTAR: 'AYAR|ATAMA'
  };
  var BEKLEYEN_DURUM = 'Beklemede';          // yalnızca henüz üst yönetime sunulmamış kayıtlar bildirilir
  /* =================================================================== */

  function E(id) { return document.getElementById(id); }
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function kirp(s) { return String(s == null ? '' : s).replace(/^\s+|\s+$/g, ''); }
  function kucuk(s) { return kirp(s).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase(); }
  function canli() { var h = (location.hostname || '').toLowerCase(); return h.indexOf('ttport') > -1 || h.indexOf('turktelekom') > -1; }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function tarihTR(d, saatli) {
    if (!d) return '—'; var x = d instanceof Date ? d : new Date(d); if (isNaN(x.getTime())) return '—';
    var s = p2(x.getDate()) + '.' + p2(x.getMonth() + 1) + '.' + x.getFullYear();
    return saatli ? s + ' ' + p2(x.getHours()) + ':' + p2(x.getMinutes()) : s;
  }
  function tarihOku(raw) { if (!raw) return null; var m = String(raw).match(/\/Date\((-?\d+)\)\//); var d = m ? new Date(parseInt(m[1], 10)) : new Date(raw); return isNaN(d.getTime()) ? null : d; }
  function gunGecti(d) { return d ? (Date.now() - d.getTime()) / 86400000 : 0; }
  function duzMetin(v) { return kirp(String(v == null ? '' : v).replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ')); }
  function sayi(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function listeUrl(l) { return CFG.SITE + "/_api/web/lists/getbytitle('" + l + "')"; }
  function siteYolu() { return CFG.SITE.replace(/^https?:\/\/[^\/]+/i, ''); }
  function tl(n) { n = Math.round(+n || 0); if (!n) return '—'; if (n < 1000) return n + ' TL'; if (n < 1e6) return (Math.round(n / 100) / 10).toLocaleString('tr-TR') + ' K TL'; return (Math.round(n / 10000) / 100).toLocaleString('tr-TR') + ' M TL'; }

  /* Takipçi sütunundaki metni ekip üyesine eşler ("Fırat Özyurt" → Fırat) */
  function kisiBul(t) {
    t = kirp(t); if (!t) return null;
    var w = ' ' + kucuk(t).replace(/[^a-zçğıöşü]+/g, ' ') + ' ', i;
    for (i = 0; i < CFG.EKIP.length; i++) if (kucuk(CFG.EKIP[i].ad) === kucuk(t) || w.indexOf(' ' + kucuk(CFG.EKIP[i].ad) + ' ') > -1) return CFG.EKIP[i];
    return null;
  }

  /* ============================ SHAREPOINT ============================ */
  var _dg = null, _dgBitis = 0, _tipler = {}, _ben = null, _formUrl = '';
  function spGet(url) {
    return fetch(url, { credentials: 'include', headers: { 'Accept': 'application/json;odata=verbose' } }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { var e = new Error('GET ' + r.status + ': ' + t.replace(/<[^>]+>/g, ' ').slice(0, 160)); e.status = r.status; throw e; });
      return r.json();
    }).then(function (j) { return j.d; });
  }
  function digest() {
    if (_dg && Date.now() < _dgBitis) return Promise.resolve(_dg);
    return fetch(CFG.SITE + '/_api/contextinfo', { method: 'POST', credentials: 'include', headers: { 'Accept': 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error('Oturum anahtarı alınamadı (' + r.status + ')'); return r.json(); })
      .then(function (j) { var c = j.d.GetContextWebInformation; _dg = c.FormDigestValue; _dgBitis = Date.now() + (c.FormDigestTimeoutSeconds - 60) * 1000; return _dg; });
  }
  function spPost(url, govde, ek) {
    return digest().then(function (dg) {
      var h = { 'Accept': 'application/json;odata=verbose', 'Content-Type': 'application/json;odata=verbose', 'X-RequestDigest': dg };
      if (ek) for (var k in ek) if (ek.hasOwnProperty(k)) h[k] = ek[k];
      return fetch(url, { method: 'POST', credentials: 'include', headers: h, body: govde ? JSON.stringify(govde) : undefined });
    }).then(function (r) {
      if (!r.ok && r.status !== 204) return r.text().then(function (t) { var e = new Error('POST ' + r.status + ': ' + t.replace(/<[^>]+>/g, ' ').slice(0, 200)); e.status = r.status; throw e; });
      if (r.status === 204) return null;
      return r.text().then(function (t) { try { return t ? JSON.parse(t).d : null; } catch (x) { return null; } });
    });
  }
  function tip(l) {
    if (_tipler[l]) return Promise.resolve(_tipler[l]);
    return spGet(listeUrl(l) + '?$select=ListItemEntityTypeFullName').then(function (d) { _tipler[l] = d.ListItemEntityTypeFullName; return _tipler[l]; });
  }
  function logEkle(v) { return tip(CFG.LOG_LISTE).then(function (t) { v.__metadata = { type: t }; return spPost(listeUrl(CFG.LOG_LISTE) + '/items', v); }); }
  function logGuncelle(id, v, etag) { return tip(CFG.LOG_LISTE).then(function (t) { v.__metadata = { type: t }; return spPost(listeUrl(CFG.LOG_LISTE) + '/items(' + id + ')', v, { 'X-HTTP-Method': 'MERGE', 'IF-MATCH': etag || '*' }); }); }
  function logSil(id) { return spPost(listeUrl(CFG.LOG_LISTE) + '/items(' + id + ')', null, { 'X-HTTP-Method': 'DELETE', 'IF-MATCH': '*' }); }
  function benKimim() {
    if (_ben) return Promise.resolve(_ben);
    return spGet(CFG.SITE + '/_api/web/currentuser?$select=Title,Email').then(function (d) { _ben = { ad: d.Title || '', mail: (d.Email || '').toLowerCase() }; return _ben; });
  }
  function formUrl() {
    if (_formUrl) return Promise.resolve(_formUrl);
    return spGet(listeUrl(CFG.LISTE) + '?$select=DefaultDisplayFormUrl').then(function (d) {
      _formUrl = location.protocol + '//' + location.host + d.DefaultDisplayFormUrl; return _formUrl;
    }, function () { return ''; });
  }

  /* ============================ VERİ ============================ */
  function ayarOku() {
    var f = encodeURIComponent("Title eq '" + CFG.AYAR_ANAHTAR + "'");
    return spGet(listeUrl(CFG.LOG_LISTE) + '/items?$select=Id,Title,Durum,Detay&$filter=' + f + '&$top=1').then(function (d) {
      var x = d.results[0]; if (!x) return null;
      var j = {}; try { j = JSON.parse(x.Detay || '{}'); } catch (e) {}
      return { id: x.Id, aktif: x.Durum === 'AKTIF', baslangic: j.baslangic ? new Date(j.baslangic) : null, kuran: j.kuran || '', altyapiUrl: j.altyapiUrl || '', ham: j };
    }, function (e) { if (e.status === 404) return null; throw e; });
  }
  /* Başlangıçtan sonra açılmış kayıtlar (yalnızca okur) */
  function kayitlariOku(baslangic) {
    var f = encodeURIComponent("Created ge datetime'" + baslangic.toISOString() + "'");
    return spGet(listeUrl(CFG.LISTE) + '/items?$select=*,Author/Title,Author/EMail&$expand=Author&$filter=' + f + '&$orderby=Id%20asc&$top=1000')
      .then(function (d) { return d.results; });
  }
  /* Harita klasörleri tek istekle: { 'P2345678': dosyaSayısı } · okunamazsa null (harita kontrol edilmez) */
  function haritaKlasorleri() {
    var u = CFG.SITE + "/_api/web/GetFolderByServerRelativeUrl('" + siteYolu() + '/' + CFG.EK_LIB + "')/Folders?$select=Name,ItemCount&$top=5000";
    return spGet(u).then(function (d) { var h = {}; (d.results || []).forEach(function (f) { h[f.Name] = f.ItemCount || 0; }); return h; }, function () { return null; });
  }
  function loglariOku() {
    var f = encodeURIComponent("substringof('|',Title)");
    return spGet(listeUrl(CFG.LOG_LISTE) + '/items?$select=Id,Title,Durum,Deneme,Created,Modified,Olay,KayitID,Kisi,Tetikleyen&$filter=' + f + '&$orderby=Id%20desc&$top=5000')
      .then(function (d) {
        var harita = {}, liste = [];
        d.results.forEach(function (x) {
          var o = { id: x.Id, anahtar: x.Title, durum: x.Durum, deneme: x.Deneme || 0, olusma: tarihOku(x.Created), degisme: tarihOku(x.Modified),
            olay: x.Olay, kayitId: x.KayitID, kisi: x.Kisi, tetikleyen: x.Tetikleyen, etag: x.__metadata ? x.__metadata.etag : '*' };
          liste.push(o);
          if (!harita[o.anahtar] || o.id < harita[o.anahtar].id) harita[o.anahtar] = o;   // en eski satır esas
        });
        return { harita: harita, liste: liste };
      });
  }

  /* ============================ EKSİK BİLGİ ============================ */
  /* Altyapı ekranındaki orEksikler() ile aynı kural + talep yazısı + harita */
  function eksikler(k, haritalar) {
    var tur = kirp(k.ProjeTuru).toUpperCase(), e = [];
    if (tur !== 'BF' && tur !== 'GF') { e.push('Proje Türü (BF/GF)'); tur = ''; }
    if (!kirp(k.ProjeID)) e.push('Proje ID');
    if (!(sayi(k.HP) > 0)) e.push('HP');
    if (!(sayi(k.MaliyetSayisal) > 0 || sayi(k.MaliyetTutari) > 0)) e.push('Toplam Maliyet');
    if (!(sayi(k.FiberMesafesi) > 0)) e.push('Fiber Mesafesi');
    if (!duzMetin(k.Adres)) e.push('Adres');
    if (tur === 'BF') {
      if (!(sayi(k.CalisanDSL) > 0)) e.push('Çalışan DSL Sayısı');
      if (!kirp(k.MevcutHiz)) e.push('Mevcut Hız');
    }
    if (k.hasOwnProperty('Asama') && !duzMetin(k.Asama)) e.push('Talep yazısı (Aşama)');
    if (haritalar) { var key = kirp(k.ProjeID) ? 'P' + kirp(k.ProjeID) : 'ITEM-' + k.Id; if (!haritalar[key]) e.push('Harita görseli'); }
    return e;
  }

  /* ============================ OLAY TESPİTİ ============================ */
  function anahtar(olay, id, kisi) { return olay + '|' + id + '|' + kisi; }
  function bitmis(loglar, k) {
    var l = loglar.harita[k];
    return l && (l.durum === 'Gonderildi' || l.durum === 'Atlandi' || (l.durum === 'Hata' && l.deneme >= CFG.MAX_DENEME));
  }
  /* → [{olay:'ATA'|'HAT', kayit, kisi, eksik, anahtar}] */
  function olaylariBul(kayitlar, loglar, haritalar, hemen) {
    var out = [];
    kayitlar.forEach(function (k) {
      if (kirp(k.OnayRed) !== BEKLEYEN_DURUM) return;
      var kisi = kisiBul(k.Takipci); if (!kisi) return;
      var olusma = tarihOku(k.Created);
      if (!hemen && olusma && (Date.now() - olusma.getTime()) < CFG.YERLESME_DK * 60000) return;   // toplu kayıt sürüyor olabilir
      var aAta = anahtar('ATA', k.Id, kisi.ad), e = eksikler(k, haritalar);
      if (!bitmis(loglar, aAta)) { out.push({ olay: 'ATA', kayit: k, kisi: kisi, eksik: e, anahtar: aAta }); return; }
      if (CFG.HATIRLATMA_GUN > 0 && e.length) {
        var ata = loglar.harita[aAta], aHat = anahtar('HAT', k.Id, kisi.ad);
        if (ata.durum === 'Gonderildi' && gunGecti(ata.degisme || ata.olusma) >= CFG.HATIRLATMA_GUN && !bitmis(loglar, aHat))
          out.push({ olay: 'HAT', kayit: k, kisi: kisi, eksik: e, anahtar: aHat });
      }
    });
    return out;
  }
  function kendisiMi(o) { return !CFG.KENDINE_DE && o.kayit.Author && kucuk(o.kayit.Author.EMail) === kucuk(o.kisi.mail); }

  /* ============================ KİLİT ============================ */
  /* Aynı bildirimi iki tarayıcı aynı anda göndermesin (ÖHE / Taahhüt alarmıyla aynı yöntem) */
  function kilitAl(o, loglar) {
    var k = o.anahtar, mevcut = loglar.harita[k], ben = _ben ? _ben.ad : '';
    if (!mevcut) {
      var benimId = null;

  function panelYenile() {
    var dot = E('vab-dot'); if (!dot) return;
    E('vab-st').innerHTML = !_ayar ? '<span class="wr">Kurulmadı</span>' : _ayar.aktif ? '<span class="ok">Aktif</span>' : '<span class="er">Pasif</span>';
    E('vab-bs').textContent = _ayar && _ayar.baslangic ? tarihTR(_ayar.baslangic, true) : '—';
    E('vab-sk').textContent = _sonKontrol ? tarihTR(_sonKontrol, true) : '—';
    E('vab-ht').textContent = CFG.HATIRLATMA_GUN > 0 ? CFG.HATIRLATMA_GUN + ' gün sonra, bir kez' : 'kapalı';
    E('vab-tog').textContent = _ayar && !_ayar.aktif ? 'Aktifleştir' : 'Pasifleştir';
    dot.className = 'on' + (_ayar && _ayar.aktif ? '' : ' err');
    if (!/open/.test(E('vab-pnl').className) || !_ayar) return;
    loglariOku().then(function (l) {
      var ad = { ATA: 'Atama', HAT: 'Hatırlatma' };
      E('vab-log').innerHTML = l.liste.slice(0, 15).map(function (x) {
        var c = x.durum === 'Gonderildi' ? 'ok' : x.durum === 'Hata' ? 'er' : x.durum === 'Atlandi' ? '' : 'wr';
        return '<div class="li"><span>' + esc(tarihTR(x.degisme, true)) + '</span><b>#' + esc(x.kayitId) + ' ' + esc(ad[x.olay] || x.olay) + ' → ' + esc(x.kisi || '') + '</b><span class="' + c + '">' + esc(x.durum) + '</span></div>';
      }).join('') || '<div class="li">Henüz bildirim yok.</div>';
    }, function () {});
  }
  function paneliBagla() {
    var dot = E('vab-dot'), pnl = E('vab-pnl');
    if (!dot || !pnl) return;
    dot.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pnl.className = /open/.test(pnl.className) ? '' : 'open'; panelYenile(); });
    pnl.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { pnl.className = ''; });
    function bagla(id, fn) { E(id).addEventListener('click', function (e) { e.preventDefault(); fn(); }); }
    bagla('vab-kur', kurOnar);
    bagla('vab-tog', aktifPasif);
    bagla('vab-chk', function () { mesaj('Kontrol ediliyor…', ''); kontrol({}, true); });
    bagla('vab-tst', testGonder);
    bagla('vab-onz', function () {
      mesaj('Hesaplanıyor…', '');
      onizle().then(function (L) {
        mesaj(L.length ? L.length + ' bildirim gönderilecek:\n' + L.map(function (x) {
          return '• ' + (x.olay === 'HAT' ? 'Hatırlatma' : 'Atama') + ' → ' + x.kisi + ' · ' + (x.proje || '#' + x.kayit) + ' · eksik: ' + x.eksik + (x.kendisi ? ' (kendi kaydı — gönderilmez)' : '');
        }).join('\n') : 'Şu an gönderilecek bildirim yok.', 'ok');
      }, function (e) { mesaj('Önizleme hatası: ' + e.message, 'er'); });
    });
  }

  /* ============================ ALTYAPI SAYFASI: ?kayit=<Id>[&eksik=…] ============================ */
  /* Mail ve Talep ekranındaki "Tamamla" bağlantısı Altyapı Takip'i ?kayit=123 ile açar → kaydın formu açılır,
     tamamlanması gereken alanlar kırmızı daire + kırmızı çerçeveyle işaretlenir, üstte liste çıkar.
     &eksik=adres~Adres yok;fiber~… gelirse o liste, gelmezse eksikler burada hesaplanır. */
  var FORM_ALAN = {
    tur: 'fProjeTuru', pid: 'fProjeId', hp: 'fHp', mal: 'fMaliyet', fiber: 'fFiberMesafe', adres: 'fAdres', dsl: 'fCalisanDsl',
    hiz: 'fMevcutHiz', asama: 'fAsama', harita: 'ekFormAlan', takipci: 'fTakipci', butce: 'fButce', sehir: 'fSehir'
  };
  var ETIKET_ANAHTAR = { 'Proje Türü (BF/GF)': 'tur', 'Proje ID': 'pid', 'HP': 'hp', 'Toplam Maliyet': 'mal', 'Fiber Mesafesi': 'fiber', 'Adres': 'adres',
    'Çalışan DSL Sayısı': 'dsl', 'Mevcut Hız': 'hiz', 'Talep yazısı (Aşama)': 'asama', 'Harita görseli': 'harita' };
  function isaretleriTemizle() {
    var L = document.querySelectorAll('.vab-eksik'), i, n;
    for (i = 0; i < L.length; i++) L[i].className = L[i].className.replace(/\s*\bvab-eksik\b/g, '');
    n = document.querySelectorAll('.vab-eksik-not, .vab-nokta, #vab-bant');
    for (i = 0; i < n.length; i++) if (n[i].parentNode) n[i].parentNode.removeChild(n[i]);
  }
  function alanKutusu(k) {
    var el = E(FORM_ALAN[k]); if (!el) return null;
    return (k === 'asama' || k === 'harita') ? el : el.parentNode;
  }
  function etiketi(k, kutu) {
    var el = E(FORM_ALAN[k]);
    return document.querySelector('label[for="' + FORM_ALAN[k] + '"]') || (kutu && kutu.querySelector('label')) || (el && el.previousElementSibling && el.previousElementSibling.tagName === 'LABEL' ? el.previousElementSibling : null);
  }
  function isaretle(L) {
    isaretleriTemizle();
    var ilk = null, goster = [];
    L.forEach(function (z) {
      var kutu = alanKutusu(z.k); if (!kutu) return;
      kutu.className += ' vab-eksik';
      var lb = etiketi(z.k, kutu);
      if (lb) { var d = document.createElement('span'); d.className = 'vab-nokta'; d.textContent = '!'; d.title = z.msg; lb.insertBefore(d, lb.firstChild); }
      var not = document.createElement('div'); not.className = 'vab-eksik-not'; not.textContent = z.msg + ' — düzenlenmesi gerekiyor';
      if (z.k === 'asama') kutu.parentNode.insertBefore(not, kutu.nextSibling); else kutu.appendChild(not);
      function bitti() { kutu.className = kutu.className.replace(/\s*\bvab-eksik\b/g, ''); if (not.parentNode) not.parentNode.removeChild(not); if (lb && lb.firstChild && lb.firstChild.className === 'vab-nokta') lb.removeChild(lb.firstChild); }
      if (z.k !== 'harita') { kutu.addEventListener('input', bitti); kutu.addEventListener('change', bitti); if (z.k === 'tur') kutu.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('button')) bitti(); }); }
      goster.push(z); if (!ilk) ilk = kutu;
    });
    if (!goster.length) return;
    var kart = document.querySelector('#pg-form .form-card'), hd = kart && kart.querySelector('.form-hd');
    if (kart) {
      var b = document.createElement('div'); b.id = 'vab-bant';
      b.innerHTML = '<b>⚠ Bu talepte ' + goster.length + ' alan tamamlanmalı.</b> Kırmızı işaretli alanları doldurup <b>Kaydet</b>\'e basın.<br>' +
        goster.map(function (z) { return '<button type="button" data-k="' + z.k + '">' + esc(z.msg) + '</button>'; }).join('');
      b.addEventListener('click', function (e) { var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if (!k) return; e.preventDefault(); var x = alanKutusu(k); if (x && x.scrollIntoView) x.scrollIntoView({ behavior: 'smooth', block: 'center' }); var f = E(FORM_ALAN[k]); if (f && f.focus && f.type !== 'hidden') setTimeout(function () { f.focus(); }, 300); });
      kart.insertBefore(b, hd ? hd.nextSibling : kart.firstChild);
    }
    if (ilk && ilk.scrollIntoView) setTimeout(function () { ilk.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
  }
  function eksikParam() {
    var m = /[?&]eksik=([^&#]*)/.exec(location.search || ''); if (!m) return null;
    return decodeURIComponent(m[1].replace(/\+/g, ' ')).split(';').map(function (x) { var p = x.split('~'); return { k: kirp(p[0]), msg: kirp(p[1] || p[0]) }; })
      .filter(function (z) { return FORM_ALAN[z.k]; });
  }
  function kayitBaglantisi() {
    var m = /[?&]kayit=(\d+)/.exec(location.search || ''); if (!m) return;
    var id = parseInt(m[1], 10), n = 0;
    (function bekle() {
      if (altyapiSayfasiMi() && window.ALL && window.ALL.length) {
        var rec = window.findById(id);
        if (!rec) { if (typeof window.toast === 'function') window.toast('Kayıt #' + id + ' ekranda yüklü kayıtlar arasında yok', 'err'); return; }
        var eski = window.goForm;   // başka bir kayıt açılınca işaretler kalksın
        if (!eski.__vab) { window.goForm = function () { isaretleriTemizle(); return eski.apply(this, arguments); }; window.goForm.__vab = true; }
        window.goForm(rec);
        var L = eksikParam();
        if (L) { setTimeout(function () { isaretle(L); }, 300); return; }
        L = eksikler(rec, null).map(function (ad) { return { k: ETIKET_ANAHTAR[ad], msg: ad + ' eksik' }; }).filter(function (z) { return z.k; });
        if (typeof window.ekListFiles === 'function' && kirp(rec.OnayRed) !== 'Onay') {
          window.ekListFiles(rec, function (e, list) {
            var var_ = (list || []).some(function (f) { return /^HARITA/i.test(f.Name || ''); });
            if (!var_) L.push({ k: 'harita', msg: 'Harita görseli eksik' });
            setTimeout(function () { isaretle(L); }, 300);
          });
        } else setTimeout(function () { isaretle(L); }, 300);
        return;
      }
      if (++n < 60) setTimeout(bekle, 500);
    })();
  }

  /* ============================ BAŞLAT ============================ */
  function baslat() {
    kayitBaglantisi();
    if (!canli()) return;
    benKimim().then(function (b) {
      _yonetici = CFG.YONETICILER.map(function (m) { return m.toLowerCase(); }).indexOf(b.mail) >= 0;
      if (_yonetici) { paneliBagla(); ayarOku().then(function (a) { _ayar = a; panelYenile(); }, function () {}); }
    }, function () {}).then(function () {
      setTimeout(function () { kontrol({}); }, 6000);
      setInterval(function () { kontrol({}); }, CFG.KONTROL_ARALIGI_DK * 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden && (!_sonKontrol || Date.now() - _sonKontrol.getTime() > 60000)) kontrol({}); });
    });
  }
  window.VHAtama = {
    kontrol: function (s) { return kontrol(s || {}, false); },
    onizle: onizle,
    durum: function () { return ayarOku(); },
    ekipAdlari: function () { return CFG.EKIP.map(function (k) { return k.ad; }); },
    eksikler: eksikler,
    CFG: CFG
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', baslat); else baslat();
})();
</script>
